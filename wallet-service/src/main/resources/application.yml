server:
  port: 8081

spring:
  application:
    name: wallet-service

  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  datasource:
    url: jdbc:mysql://localhost:3306/test
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  cloud:
    function:
      definition: consume
    stream:
      bindings:
        consume-in-0:
          destination: payment
          group: wallet-service
        consume-out-0:
          destination: wallet-event
      kafka:
        binder:
          brokers: localhost:9092
          auto-create-topics: true
          transaction:
            transaction-id-prefix: wallet-tx-
            producer:
              configuration:
                acks: all
                retries: 10
          configuration:
            isolation.level: read_committed
        bindings:
          consume-in-0:
            consumer:
              auto-commit-offset: false
              configuration:
                isolation.level: read_committed
              enable-dlq: true
              dlq-name: payment-dlq

logging:
  level:
    org:
      springframework:
        transaction: TRACE
        orm:
          jpa: DEBUG
        kafka: TRACE